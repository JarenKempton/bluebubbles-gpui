[package]
name = "bluebubbles-gpui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
dirs = "7.0.0"
futures = "0.3.34"
futures-util = "0.3.34"
gpui-kit = "0.7"
imagesize = "0.15.0"
mime_guess = "2.0.5"
notify-rust = "4.18.2"
open = "5.4.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
rust_socketio = { version = "0.6", features = ["async"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "1.28.0", features = ["v4"] }
